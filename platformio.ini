[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_ldf_mode = deep+

lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    adafruit/RTClib

; Nomes/versões das libs a confirmar na primeira build real (pio run) —
; ESPAsyncWebServer teve forks divergentes, verificar qual está ativo no registry.
